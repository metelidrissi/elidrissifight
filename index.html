<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>El Idrissi Fight</title><style>@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;900&display=swap');*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070707;color:#fff;font-family:Montserrat,Arial;touch-action:none}button{font:inherit}.s{position:fixed;inset:0;display:none}.s.on{display:block}.logo{font:italic 70px Anton;text-shadow:0 5px #111}.logo b{color:#e63224}.select{padding:20px;overflow:auto;background:radial-gradient(circle at 50% 20%,#50301a,#15100d 38%,#050607 80%)}.top{max-width:1450px;margin:auto;display:flex;justify-content:space-between;align-items:end}.tag{font-size:11px;color:#d8b56f;letter-spacing:5px}.roster{max-width:1450px;margin:20px auto 90px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{height:260px;position:relative;overflow:hidden;border:1px solid #674a28;background:linear-gradient(150deg,#362b20,#101112);box-shadow:0 15px 35px #0008;cursor:pointer;transform:skewX(-3deg);transition:.15s}.card.sel{border-color:#ffd46a;box-shadow:0 0 0 2px #8a5d20,0 0 30px #e9ad443d;transform:skewX(-3deg) translateY(-7px)}.art{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}.mini{transform:scale(.72);transform-origin:bottom}.cn{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(transparent,#000);font:italic 27px Anton;text-transform:uppercase}.cn small{display:block;font:700 9px Montserrat;color:#e4bb69;letter-spacing:1px}.go{position:fixed;right:20px;bottom:16px;border:1px solid #ffe19a;background:linear-gradient(#d9a843,#845315);color:#120d06;padding:12px 26px;font:26px Anton;transform:skewX(-10deg);opacity:.35}.go.ready{opacity:1}.vs{display:flex!important;opacity:0;pointer-events:none;align-items:center;justify-content:center;background:radial-gradient(circle,#6a2117,#130706 55%,#000);transition:.2s}.vs.on{opacity:1}.vsgrid{width:min(1050px,95vw);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;text-align:center}.vsgrid .fighter{margin:auto;transform:scale(1.08)}.vsname{font:italic 55px Anton}.vst{font:90px Anton;color:#e73b28;text-shadow:0 6px #4a0f0a}.arena{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#31243a 0 52%,#6b3824 52%)}.sky{position:absolute;inset:0 0 43%;background:radial-gradient(circle at 50% 70%,#ffb44e,#a94a36 28%,#35263e 60%,#111)}.city{position:absolute;left:0;right:0;bottom:40%;height:250px;background:#211817;clip-path:polygon(0 50%,5% 50%,5% 22%,9% 22%,9% 55%,15% 55%,15% 31%,22% 31%,22% 52%,29% 52%,29% 28%,35% 28%,35% 50%,44% 50%,44% 13%,49% 13%,49% 55%,57% 55%,57% 33%,65% 33%,65% 52%,73% 52%,73% 25%,79% 25%,79% 56%,87% 56%,87% 35%,93% 35%,93% 49%,100% 49%,100% 100%,0 100%)}.floor{position:absolute;left:-10%;right:-10%;bottom:-11%;height:59%;background:repeating-linear-gradient(90deg,#4c2c21 0 2px,#372019 2px 105px),repeating-linear-gradient(0deg,transparent 0 70px,#d28a4d22 72px),linear-gradient(#7b472c,#21120d);transform:perspective(600px) rotateX(58deg);transform-origin:bottom}.lamp{position:absolute;bottom:40%;width:13px;height:46px;background:linear-gradient(#32180d,#ffd06e,#32180d);box-shadow:0 0 24px #ffad3a}.hud{position:absolute;z-index:30;left:2%;right:2%;top:10px;display:grid;grid-template-columns:1fr 90px 1fr;gap:10px}.nb{font:italic 30px Anton;text-transform:uppercase}.r{text-align:right}.hpbox{height:28px;border:3px solid #ead08a;background:#111;transform:skewX(-12deg)}.hp{height:100%;width:100%;background:linear-gradient(90deg,#ffe58e,#e2a92f,#ff663c);transition:.18s}.r .hp{margin-left:auto;background:linear-gradient(270deg,#ffe58e,#e2a92f,#ff663c)}.meter{height:7px;background:#111;border:1px solid #8fbfff;margin-top:4px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#65d7ff,#2a62ff);transition:.15s}.timer{font:50px Anton;text-align:center;color:#ffe4a5;text-shadow:0 4px #40240d}.stage{position:absolute;left:0;right:0;bottom:7%;height:71%}.slot{position:absolute;bottom:0;width:250px;height:490px;transition:left .08s;filter:drop-shadow(0 20px 12px #0008)}.slot.p{left:18%}.slot.e{left:68%;transform:scaleX(-1)}.slot.e .fighter{transform:scaleX(-1)}.fighter{position:relative;width:220px;height:420px;transform-origin:50% 90%;--skin:#b47754;--cloth:#222;--accent:#d0aa5d;--hair:#17110e}.head{position:absolute;z-index:6;left:69px;top:28px;width:82px;height:94px;border-radius:48% 48% 42% 42%;background:radial-gradient(circle at 63% 35%,#eab48d 0 10%,var(--skin) 54%,#70442f);border:2px solid #5a3426}.hair{position:absolute;z-index:7;left:72px;top:22px;width:76px;height:38px;border-radius:45px 45px 12px 12px;background:var(--hair)}.eye{position:absolute;z-index:9;top:67px;width:7px;height:4px;background:#17100d;border-radius:50%}.eye.l{left:91px}.eye.r{left:123px}.brow{position:absolute;z-index:9;top:57px;width:18px;height:3px;background:#2a160e}.brow.l{left:84px;transform:rotate(-8deg)}.brow.r{left:118px;transform:rotate(8deg)}.nose{position:absolute;z-index:9;left:108px;top:67px;width:9px;height:18px;border-right:3px solid #75452f}.mouth{position:absolute;z-index:9;left:98px;top:92px;width:25px;height:5px;border-bottom:3px solid #682d28}.torso{position:absolute;z-index:3;left:53px;top:111px;width:115px;height:155px;border-radius:42% 42% 24% 24%;background:linear-gradient(90deg,#1115,var(--cloth) 24% 76%,#fff2);border:2px solid #0006}.belt{position:absolute;z-index:5;left:54px;top:244px;width:112px;height:17px;background:linear-gradient(#e8c26b,#7b501d,#e8c26b)}.arm{position:absolute;z-index:2;top:125px;width:45px;height:150px;border-radius:24px;background:linear-gradient(90deg,#1114,var(--cloth));transform-origin:50% 18px}.arm:after{content:'';position:absolute;left:2px;bottom:-20px;width:40px;height:45px;border-radius:50%;background:var(--skin)}.arm.l{left:29px;transform:rotate(10deg)}.arm.r{right:28px;transform:rotate(-10deg)}.leg{position:absolute;z-index:1;top:250px;width:58px;height:153px;border-radius:20px 20px 10px 10px;background:linear-gradient(90deg,#090909,var(--cloth));transform-origin:50% 10px}.leg:after{content:'';position:absolute;bottom:-10px;width:76px;height:25px;background:#151515;border-radius:18px 24px 8px 8px}.leg.l{left:50px;transform:rotate(3deg)}.leg.r{right:50px;transform:rotate(-3deg)}.hijab .hair{display:none}.hijab:before{content:'';position:absolute;z-index:7;left:58px;top:15px;width:104px;height:120px;border-radius:55px 55px 38px 38px;background:var(--accent);clip-path:polygon(8% 0,92% 0,100% 70%,78% 100%,22% 100%,0 70%)}.hijab .head{z-index:8;width:70px;height:82px;left:75px;top:34px}.bulky .torso{left:37px;width:147px;border-radius:48% 48% 30% 30%}.bulky .belt{left:39px;width:142px}.bulky .arm.l{left:17px}.bulky .arm.r{right:17px}.glasses:after{content:'◯  ◯';position:absolute;z-index:12;left:77px;top:52px;font-size:25px;color:#111;letter-spacing:3px}.white{--cloth:#f3eee5;--accent:#fbf6e8}.navy{--cloth:#172536;--accent:#d0a74f}.black{--cloth:#151515;--accent:#262626}.street{--cloth:#292929;--accent:#aaa}.red{--cloth:#702421;--accent:#8d322d}.karate{--cloth:#eee;--accent:#111}.attack .arm.r{animation:punch .22s}.kick .leg.r{animation:kick .31s}.special{animation:special .55s}.hit{animation:hit .18s}.block{filter:drop-shadow(0 0 22px #69cfff)}@keyframes punch{50%{transform:rotate(-94deg) translateY(-45px)}}@keyframes kick{50%{transform:rotate(-84deg) translate(30px,-25px)}}@keyframes special{25%{filter:drop-shadow(0 0 30px #ffce55) brightness(1.5);transform:scale(1.08)}50%{transform:translateX(55px) scale(1.08)}}@keyframes hit{50%{transform:translateX(-24px) rotate(-4deg);filter:brightness(2)}}.shock{position:absolute;z-index:20;width:34px;height:34px;border-radius:50%;border:5px solid #ffd261;box-shadow:0 0 34px #ff8737;animation:boom .42s forwards}@keyframes boom{to{transform:scale(6);opacity:0}}.float{position:absolute;z-index:22;font:27px Anton;color:#ffd45e;text-shadow:0 3px #000;animation:flt .7s forwards}@keyframes flt{to{transform:translateY(-75px) scale(1.2);opacity:0}}.combo{position:absolute;z-index:22;left:4%;top:27%;font:34px Anton;color:#ffd04d;opacity:0}.combo.show{animation:co .8s}@keyframes co{30%{opacity:1;transform:scale(1.2)}100%{opacity:0}}.word{position:absolute;z-index:40;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-4deg);font:clamp(75px,14vw,180px) Anton;color:#ffcf4f;text-shadow:8px 8px #a31c15,0 0 40px #ff5c26}.caption{position:absolute;z-index:20;left:50%;bottom:4%;transform:translateX(-50%);font:17px Anton;color:#f2d084;letter-spacing:2px}.touch{position:absolute;z-index:35;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:end}.dpad,.acts{display:grid;grid-template-columns:66px 66px;gap:8px}.btn{width:64px;height:64px;border-radius:50%;border:2px solid #ffffff55;background:#07090cba;color:#fff;font-weight:900;backdrop-filter:blur(8px)}.btn:active{transform:scale(.92);background:#a8732c}.result{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:#050505dc;backdrop-filter:blur(7px)}.result.on{display:flex}.result h2{font:clamp(70px,12vw,150px) Anton;margin:0;color:#ffd05a;text-shadow:7px 7px #841b16}.result button{padding:13px 22px;border:1px solid #e7c678;background:#a66d22;color:#fff;font-weight:900}.rage{box-shadow:0 0 35px #ff2d17}@media(max-width:800px){.logo{font-size:42px}.tag{display:none}.roster{grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:100px}.card{height:220px}.mini{transform:scale(.6)}.cn{font-size:22px}.go{font-size:21px}.hud{grid-template-columns:1fr 58px 1fr;gap:5px}.timer{font-size:38px}.nb{font-size:16px}.hpbox{height:21px}.stage{bottom:15%;height:62%}.slot{width:175px;height:350px}.slot.p{left:3%}.slot.e{left:55%}.slot .fighter{transform:scale(.76);transform-origin:bottom left}.slot.e .fighter{transform:scaleX(-1) scale(.76);transform-origin:bottom right}.dpad,.acts{grid-template-columns:56px 56px}.btn{width:54px;height:54px;font-size:10px}.caption{bottom:12%;font-size:12px}.vsgrid .fighter{transform:scale(.7)}.vsname{font-size:28px}.vst{font-size:55px}}</style></head><body><section id="select" class="s select on"><div class="top"><div><div class="logo">EL IDRISSI <b>FIGHT</b></div><div class="tag">FAMILY · HONOR · NO LIMITS</div></div><div class="tag">10 LEYENDAS · UNA FAMILIA</div></div><div id="roster" class="roster"></div><button id="go" class="go">LUCHAR</button></section><section id="vs" class="s vs"><div class="vsgrid"><div><div id="vp"></div><div id="vpn" class="vsname"></div></div><div class="vst">VS</div><div><div id="ve"></div><div id="ven" class="vsname"></div></div></div></section><section id="fight" class="s"><div id="arena" class="arena"><div class="sky"></div><div class="city"></div><div class="floor"></div><i class="lamp" style="left:8%"></i><i class="lamp" style="right:8%"></i><div class="hud"><div><div id="pn" class="nb"></div><div class="hpbox"><div id="php" class="hp"></div></div><div class="meter"><i id="pm"></i></div></div><div id="timer" class="timer">60</div><div class="r"><div id="en" class="nb r"></div><div class="hpbox"><div id="ehp" class="hp"></div></div><div class="meter"><i id="em"></i></div></div></div><div class="stage"><div id="pslot" class="slot p"></div><div id="eslot" class="slot e"></div></div><div id="combo" class="combo"></div><div id="caption" class="caption"></div><div id="word" class="word">FIGHT!</div><div class="touch"><div class="dpad"><button class="btn" data-hold="left">◀</button><button class="btn" data-hold="right">▶</button><button class="btn" data-action="jump">▲</button><button class="btn" data-hold="block">🛡</button></div><div class="acts"><button class="btn" data-action="punch">PUÑO</button><button class="btn" data-action="kick">PATADA</button><button class="btn" data-action="special">ESPECIAL</button><button class="btn" data-action="dash">DASH</button></div></div><div id="result" class="result"><h2 id="rt"></h2><p id="rd"></p><button onclick="location.reload()">VOLVER AL ROSTER</button></div></div></section><script>const C=[{id:'hanna',name:'Hanna Fatima',title:'LA MATRIARCA',cls:'hijab white',skin:'#b77b59',cloth:'#f4efe7',accent:'#fff7e6',hair:'#ddd',power:10,speed:5,special:'CHANCLETAZO CELESTIAL',quote:'La tranquilidad también pega.',dmg:[10,18,44]},{id:'abdel',name:'Abdelkader',title:'EL TANQUE',cls:'bulky',skin:'#a86c4d',cloth:'#4a4038',accent:'#9d6a31',hair:'#1a120e',power:9,speed:4,special:'EMBESTIDA DEL PATRIARCA',quote:'Más panza, más fuerza.',dmg:[12,20,38]},{id:'miloud',name:'Miloud',title:'EL PLACADOR',cls:'bulky navy',skin:'#9d6649',cloth:'#222a31',accent:'#bd8f48',hair:'#16110e',power:8,speed:6,special:'PLACAJE IMPARABLE',quote:'Si arranca, aparta.',dmg:[11,21,36]},{id:'hada',name:'Hada',title:'LA BURLONA',cls:'black',skin:'#b87555',cloth:'#151515',accent:'#d6b66e',hair:'#17110e',power:6,speed:9,special:'RISA DEVASTADORA',quote:'Se ríe. Tú pierdes.',dmg:[9,17,34]},{id:'mohamed',name:'Mohamed',title:'EL ARCANO',cls:'glasses navy',skin:'#a96f51',cloth:'#172536',accent:'#d0a74f',hair:'#17110f',power:8,speed:8,special:'ARCANO DE HIERRO',quote:'Elegancia y energía.',dmg:[10,19,39]},{id:'zoher',name:'Zoher',title:'MDLR',cls:'street',skin:'#aa704f',cloth:'#242424',accent:'#aaa',hair:'#15100e',power:6,speed:10,special:'RUEDA CALLEJERA',quote:'Patinete, bici y caos.',dmg:[8,16,35]},{id:'suliman',name:'Suliman',title:'EL CABEZAZO',cls:'navy',skin:'#aa704f',cloth:'#152334',accent:'#d2ad5a',hair:'#16110e',power:8,speed:7,special:'CABEZAZO EJECUTIVO',quote:'Americana. Impacto.',dmg:[10,20,37]},{id:'tamimount',name:'Tamimount',title:'LA MIRADA',cls:'hijab red',skin:'#a96f50',cloth:'#6a2523',accent:'#7d2f2b',hair:'#222',power:7,speed:6,special:'MIRADA FINAL',quote:'No hace falta hablar.',dmg:[10,18,40]},{id:'jamila',name:'Jamila',title:'LA ESCOBA',cls:'hijab black glasses',skin:'#aa704f',cloth:'#1d1b1a',accent:'#2a2826',hair:'#222',power:8,speed:6,special:'ESCOBA SUPREMA',quote:'La casa queda limpia.',dmg:[11,20,39]},{id:'nabila',name:'Nabila',title:'KARATE QUEEN',cls:'karate',skin:'#b97856',cloth:'#eee',accent:'#111',hair:'#1a100d',power:7,speed:9,special:'PATADA BELHAJ',quote:'Precisión antes que fuerza.',dmg:[9,19,38]}],$=x=>document.getElementById(x);let sel=null,enemy=null,ph=100,eh=100,pm=0,em=0,px=18,ex=68,block=false,end=false,t=60,aiT,clock,ready=true,combo=0,last=0,keys={},enemyBlock=false;function F(c,m=false){return `<div class="fighter ${c.cls} ${m?'mini':''}" style="--skin:${c.skin};--cloth:${c.cloth};--accent:${c.accent};--hair:${c.hair}"><div class="hair"></div><div class="head"></div><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i><div class="torso"></div><div class="belt"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div>`}C.forEach(c=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="art">${F(c,true)}</div><div class="cn">${c.name}<small>${c.title}</small></div>`;d.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');sel=c;$('go').classList.add('ready')};$('roster').appendChild(d)});$('go').onclick=()=>{if(!sel)return;let p=C.filter(x=>x.id!==sel.id);enemy=p[Math.floor(Math.random()*p.length)];$('vp').innerHTML=F(sel);$('ve').innerHTML=F(enemy);$('vpn').textContent=sel.name;$('ven').textContent=enemy.name;$('select').classList.remove('on');$('vs').classList.add('on');setTimeout(start,1500)};function start(){$('vs').classList.remove('on');$('fight').classList.add('on');$('pn').textContent=sel.name;$('en').textContent=enemy.name;$('pslot').innerHTML=F(sel);$('eslot').innerHTML=F(enemy);$('caption').textContent=sel.quote;setTimeout(()=>$('word').remove(),850);upd();clock=setInterval(()=>{if(!end&&--t>=0)$('timer').textContent=t;if(t<=0&&!end)finish(ph>=eh)},1000);aiT=setInterval(ai,430);requestAnimationFrame(loop)}function upd(){$('pslot').style.left=px+'%';$('eslot').style.left=ex+'%';$('php').style.width=Math.max(0,ph)+'%';$('ehp').style.width=Math.max(0,eh)+'%';$('pm').style.width=pm+'%';$('em').style.width=em+'%';$('php').classList.toggle('rage',ph<25);$('ehp').classList.toggle('rage',eh<25)}function anim(slot,c,ms=300){let f=slot.querySelector('.fighter');f.classList.remove('attack','kick','special','hit','block');void f.offsetWidth;f.classList.add(c);setTimeout(()=>f.classList.remove(c),ms)}function fx(x,y,txt){let s=document.createElement('i');s.className='shock';s.style.left=x+'%';s.style.top=y+'%';$('arena').appendChild(s);setTimeout(()=>s.remove(),430);let z=document.createElement('div');z.className='float';z.textContent=txt;z.style.left=x+'%';z.style.top=y-5+'%';$('arena').appendChild(z);setTimeout(()=>z.remove(),700)}function atk(type){if(end||!ready)return;ready=false;setTimeout(()=>ready=true,type==='special'?620:250);let i=type==='punch'?0:type==='kick'?1:2;anim($('pslot'),type==='punch'?'attack':type==='kick'?'kick':'special',type==='special'?600:290);let range=type==='special'?28:21;if(ex-px<=range){let d=sel.dmg[i]*(enemyBlock?.32:1);if(ph<25&&i===2)d*=1.25;eh-=d;pm=Math.min(100,pm+10);em=Math.min(100,em+5);anim($('eslot'),'hit',180);ex=Math.min(82,ex+(i===2?8:3));fx(ex+2,48,i===2?sel.special:'-'+Math.round(d));let n=Date.now();combo=n-last<900?combo+1:1;last=n;if(combo>=2){$('combo').textContent=combo+' HIT COMBO';$('combo').classList.remove('show');void $('combo').offsetWidth;$('combo').classList.add('show')}if(i===2)pm=Math.max(0,pm-35);upd();if(eh<=0)finish(true)}else fx(px+18,52,'MISS')}function ai(){if(end)return;let d=ex-px;enemyBlock=false;if(d>22){ex-=Math.min(4,d-19);upd();return}let r=Math.random();if(r<.13){enemyBlock=true;anim($('eslot'),'block',300);return}if(r<.24&&d<15){ex=Math.min(83,ex+5);upd();return}let i=r<.64?0:r<.9?1:2;anim($('eslot'),i===0?'attack':i===1?'kick':'special',i===2?580:280);setTimeout(()=>{if(end||ex-px>24)return;let dmg=enemy.dmg[i]*(block?.28:1);if(eh<25&&i===2)dmg*=1.2;ph-=dmg;em=Math.min(100,em+10);pm=Math.min(100,pm+5);anim($('pslot'),'hit',180);px=Math.max(2,px-(i===2?7:3));fx(px+10,48,i===2?enemy.special:'-'+Math.round(dmg));if(i===2)em=Math.max(0,em-35);upd();if(ph<=0)finish(false)},i===2?250:105)}function finish(w){if(end)return;end=true;clearInterval(aiT);clearInterval(clock);$('rt').textContent=w?'K.O. VICTORIA':'K.O. DERROTA';$('rd').textContent=w?sel.name+' ha derrotado a '+enemy.name:enemy.name+' gana el combate';$('result').classList.add('on')}function loop(){if(end)return;if(keys.left)px=Math.max(1,px-.43);if(keys.right)px=Math.min(ex-9,px+.43);if(block)anim($('pslot'),'block',70);upd();requestAnimationFrame(loop)}function jump(){$('pslot').animate([{transform:'translateY(0)'},{transform:'translateY(-110px)'},{transform:'translateY(0)'}],{duration:500,easing:'ease-out'})}function dash(){px=Math.min(ex-10,px+8);upd()}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowleft')keys.left=true;if(k==='arrowright')keys.right=true;if(e.key==='Shift')block=true;if(k==='a')atk('punch');if(k==='s')atk('kick');if(k==='d')atk('special');if(k==='arrowup')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key==='Shift')block=false});document.querySelectorAll('[data-action]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();let a=b.dataset.action;if(['punch','kick','special'].includes(a))atk(a);if(a==='jump')jump();if(a==='dash')dash()});document.querySelectorAll('[data-hold]').forEach(b=>{let h=b.dataset.hold;b.onpointerdown=e=>{e.preventDefault();h==='block'?block=true:keys[h]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{h==='block'?block=false:keys[h]=false}});</script></body></html>
