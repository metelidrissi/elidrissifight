<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Idrissi Fighters</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0c0d11;color:#fff}section{min-height:100vh;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#202533;border:2px solid transparent;border-radius:16px;padding:12px;cursor:pointer}.card.sel{border-color:#f2c14e}.portrait{font-size:70px;text-align:center;padding:25px}.name{font-weight:900}.desc{color:#aaa;font-size:12px;min-height:38px}.start{margin:20px 0;padding:15px 25px;border:0;border-radius:30px;background:#f2c14e;font-weight:bold}.hidden{display:none!important}#fight{background:linear-gradient(#56758c 0 50%,#9b7547 50%);position:relative}.hud{display:flex;gap:12px;align-items:center}.side{flex:1}.bar{height:25px;background:#222;border:3px solid #111}.hp{height:100%;background:#36d77d;width:100%}.right{text-align:right}.arena{height:70vh;position:relative}.fighter{position:absolute;bottom:80px;font-size:120px;transition:left .12s}.enemy{transform:scaleX(-1)}.controls{position:absolute;bottom:10px;width:100%;text-align:center;background:#0008;padding:10px}.result{position:absolute;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:28px}.result button{padding:12px 20px}.fx{position:absolute;font-weight:bold;font-size:25px;animation:up .6s forwards}@keyframes up{to{transform:translateY(-70px);opacity:0}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.fighter{font-size:80px}}</style></head><body><section id="select"><h1>EL IDRISSI FIGHTERS</h1><p>Elige tu luchador</p><div id="grid" class="grid"></div><button id="start" class="start">ELIGE PERSONAJE</button></section><section id="fight" class="hidden"><div class="hud"><div class="side"><b id="pn"></b><div class="bar"><div id="php" class="hp"></div></div></div><b id="time">60</b><div class="side right"><b id="en"></b><div class="bar"><div id="ehp" class="hp"></div></div></div></div><div id="arena" class="arena"><div id="p" class="fighter"></div><div id="e" class="fighter enemy"></div><div class="controls">← → mover · A golpe · S fuerte · D especial · Shift bloquear</div><div id="result" class="result hidden"><h2 id="rt"></h2><p id="rd"></p><button onclick="location.reload()">VOLVER</button></div></div></section><script>const C=[['hanna','Hanna Fatima','🧕🏻','70 años · blanco total · chancletazo legendario',[18,30,52],'CHANCLA FINAL','abdel'],['abdel','Abdelkader El Idrissi','👨🏼‍🦲','60 años · grandote · potencia pura',[14,24,38],'EMBESTIDA DEL PATRIARCA','miloud'],['miloud','Miloud El Idrissi','🧔🏻','42 años · especialista en placajes',[12,23,37],'PLACAJE IMPARABLE','suliman'],['hada','Hada El Idrissi','💃🏻','Moda y ataques de risa',[10,18,33],'RISA DEVASTADORA','zoher'],['mohamed','Mohamed El Idrissi','🧙🏻‍♂️','35 años · alto · elegante · magia tecnológica',[12,22,40],'ARCANO DE HIERRO','nabila'],['zoher','Zoher El Idrissi','🛴','20 años · MDLR · patinete y calle',[9,19,34],'RUEDA CALLEJERA','hada'],['suliman','Suliman El Idrissi','🤵🏻','Alto · elegante · cabezazos',[13,24,39],'CABEZAZO EJECUTIVO','miloud'],['tamimount','Tamimount El Idrissi','👩🏻‍🍼','40 años · carrito · mirada asesina',[11,20,41],'MIRADA FINAL','jamila'],['jamila','Jamila Monhou','🧕🏽','Hijab · maestra del palo de escoba',[12,23,38],'ESCOBA SUPREMA','tamimount'],['nabila','Nabila Belhaj','🥋','25 años · karate · técnica y velocidad',[11,21,39],'PATADA BELHAJ','mohamed']];let s=null,o=null,ph=100,eh=100,px=10,ex=72,block=false,end=false,ai,t=60;const $=x=>document.getElementById(x);C.forEach(c=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class="portrait">'+c[2]+'</div><div class="name">'+c[1]+'</div><div class="desc">'+c[3]+'</div><small>'+c[5]+'</small>';d.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');s=c;$('start').textContent='COMBATIR CON '+c[1].toUpperCase()};$('grid').appendChild(d)});$('start').onclick=()=>{if(!s)return;o=C.find(x=>x[0]===s[6]);$('select').classList.add('hidden');$('fight').classList.remove('hidden');$('pn').textContent=s[1];$('en').textContent=o[1];$('p').textContent=s[2];$('e').textContent=o[2];pos();ai=setInterval(cpu,750);setInterval(()=>{if(!end&&--t>=0)$('time').textContent=t;if(t<=0&&!end)done(ph>=eh)},1000)};function pos(){$('p').style.left=px+'%';$('e').style.left=ex+'%'}function bars(){$('php').style.width=Math.max(0,ph)+'%';$('ehp').style.width=Math.max(0,eh)+'%'}function near(){return Math.abs(ex-px)<20}function fx(txt,x){let q=document.createElement('div');q.className='fx';q.textContent=txt;q.style.left=x+'%';q.style.bottom='250px';$('arena').appendChild(q);setTimeout(()=>q.remove(),650)}function hit(i){if(end)return;if(!near()){fx('MISS',px+8);return}eh-=s[4][i];fx(i===2?s[5]:'-'+s[4][i],ex);bars();if(eh<=0)done(true)}function cpu(){if(end)return;if(ex-px>17){ex-=5;pos();return}let i=Math.random()<.65?0:Math.random()<.8?1:2,d=o[4][i]*(block?.35:1);ph-=d;fx(i===2?o[5]:'-'+Math.round(d),px);bars();if(ph<=0)done(false)}function done(w){end=true;clearInterval(ai);$('rt').textContent=w?'K.O. ¡VICTORIA!':'K.O. DERROTA';$('rd').textContent=w?s[1]+' ha derrotado a '+o[1]:o[1]+' gana el combate';$('result').classList.remove('hidden')}addEventListener('keydown',e=>{if(end)return;if(e.key==='ArrowLeft'){px=Math.max(0,px-4);pos()}if(e.key==='ArrowRight'){px=Math.min(ex-7,px+4);pos()}if(e.key.toLowerCase()==='a')hit(0);if(e.key.toLowerCase()==='s')hit(1);if(e.key.toLowerCase()==='d')hit(2);if(e.key==='Shift')block=true});addEventListener('keyup',e=>{if(e.key==='Shift')block=false});</script></body></html>
