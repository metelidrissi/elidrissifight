<style>
:root{--gold:#e8bd55;--red:#dc3246;--ink:#090b10;--panel:#141923;--white:#f7f7f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:Inter,Arial,sans-serif}button{font:inherit;color:inherit}
.screen{position:fixed;inset:0}.hidden{display:none!important}
#select{overflow:auto;background:radial-gradient(circle at 50% -15%,#4d2331 0,#141824 35%,#07090d 72%);padding:22px 18px 40px}
.logo{text-align:center;font-size:clamp(36px,9vw,84px);font-weight:1000;letter-spacing:-.055em;line-height:.86;margin:16px 0 8px;text-transform:uppercase;font-style:italic}.logo b{color:var(--gold)}
.sub{text-align:center;color:#9ea8b8;letter-spacing:.18em;text-transform:uppercase;font-size:11px;margin-bottom:24px}
.grid{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{appearance:none;border:1px solid #30384a;background:linear-gradient(160deg,#222a38,#0e1219);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left;transition:.16s;position:relative;min-height:180px}.card:hover,.card.sel{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 14px 35px #0008}.card.sel:after{content:'PLAYER 1';position:absolute;top:8px;right:8px;background:var(--gold);color:#111;font-weight:1000;font-size:9px;padding:5px 7px;transform:skew(-8deg)}.avatar{height:130px;position:relative;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 30%,#4e596d,#202735 65%,#10141c)}.avatar .sil{font-size:72px;filter:grayscale(.15) drop-shadow(0 8px 8px #0009);transform:translateY(4px)}.cardName{padding:10px 10px 4px;font-weight:1000;font-size:14px;text-transform:uppercase;line-height:1}.move{padding:0 10px 11px;color:#9da7b9;font-size:10px;text-transform:uppercase}.power{position:absolute;left:8px;top:8px;font-size:9px;background:#0009;padding:5px 6px;border-radius:4px;color:#fff}.choose{display:block;margin:22px auto 0;border:0;background:linear-gradient(#f5d477,#d5a737);color:#111;font-weight:1000;font-style:italic;text-transform:uppercase;padding:14px 26px;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);min-width:240px;cursor:pointer}.choose:disabled{filter:grayscale(1);opacity:.45}
#versus{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#3a141d,#07090d 65%);z-index:20}.vsWrap{display:flex;align-items:center;gap:clamp(20px,8vw,110px)}.vsName{font-size:clamp(19px,3vw,38px);font-weight:1000;text-transform:uppercase;width:min(34vw,330px);text-align:center}.vsBadge{font-size:clamp(60px,14vw,160px);font-weight:1000;font-style:italic;color:var(--red);text-shadow:0 4px 0 #711a26,0 0 30px #dc324677;transform:skew(-9deg)}.vsMini{font-size:clamp(75px,14vw,150px);display:block;margin-bottom:15px;filter:drop-shadow(0 20px 12px #000a)}
#game{background:#000}#renderCanvas{width:100%;height:100%;touch-action:none;display:block;outline:none}.hud{position:absolute;z-index:5;top:12px;left:3%;right:3%;display:grid;grid-template-columns:1fr 58px 1fr;gap:10px;align-items:start;pointer-events:none}.hudName{font-weight:1000;text-transform:uppercase;font-size:clamp(11px,2vw,19px);text-shadow:0 2px 2px #000}.enemyHud .hudName{text-align:right}.health{height:23px;background:#17181d;border:2px solid #e7e8e9;box-shadow:0 2px 5px #000b;overflow:hidden;transform:skew(-9deg)}.hp{height:100%;width:100%;background:linear-gradient(90deg,#57db6b,#d0ef50);transition:width .18s}.enemyHud .hp{margin-left:auto;background:linear-gradient(90deg,#d0ef50,#57db6b)}.timer{font-size:30px;line-height:33px;text-align:center;font-weight:1000;background:#111c;border:2px solid #fff;padding:2px}.round{position:absolute;z-index:6;top:22%;width:100%;text-align:center;font-size:clamp(42px,9vw,105px);font-weight:1000;font-style:italic;text-transform:uppercase;text-shadow:0 5px 0 #000,0 0 18px #000;pointer-events:none;animation:roundAnim .8s both}@keyframes roundAnim{0%{transform:scale(2);opacity:0}35%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
.touch{position:absolute;z-index:9;left:0;right:0;bottom:max(13px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.pad,.actions{display:flex;gap:9px;align-items:flex-end;pointer-events:auto}.ctrl{width:60px;height:60px;border-radius:50%;border:2px solid #ffffff80;background:#10131ac7;backdrop-filter:blur(5px);font-weight:1000;font-size:20px;display:grid;place-items:center;user-select:none}.actions{display:grid;grid-template-columns:repeat(2,62px);transform:rotate(-5deg)}.actions .ctrl{width:62px;height:62px}.ctrl.kick{background:#8c2733cc}.ctrl.punch{background:#233d85cc}.ctrl.special{background:#80631dcc;color:#ffe489}.ctrl.block{background:#30343dcc;font-size:11px}
.result{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05070add;text-align:center}.result h2{font-size:clamp(58px,14vw,150px);line-height:.8;margin:0;font-style:italic;text-transform:uppercase;color:#fff;text-shadow:0 7px 0 #8e1e2c}.result p{font-size:18px;color:#c8cdd7}.result button{border:0;background:var(--gold);color:#111;padding:14px 22px;font-weight:1000;cursor:pointer}.help{position:absolute;z-index:8;bottom:8px;width:100%;text-align:center;color:#ffffff90;font-size:10px;pointer-events:none}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:152px}.avatar{height:108px}.touch{padding:0 10px}.ctrl{width:52px;height:52px}.actions{grid-template-columns:repeat(2,54px)}.actions .ctrl{width:54px;height:54px}.help{display:none}}
</style>
</head>
<body>
<section id="select" class="screen">
  <div class="logo">EL IDRISSI <b>FIGHT</b></div><div class="sub">Family Tournament · 3D Edition</div>
  <div id="grid" class="grid"></div><button id="choose" class="choose" disabled>Elige luchador</button>
</section>
<section id="versus" class="screen hidden"><div class="vsWrap"><div id="vsP" class="vsName"></div><div class="vsBadge">VS</div><div id="vsE" class="vsName"></div></div></section>
<section id="game" class="screen hidden">
 <canvas id="renderCanvas"></canvas>
 <div class="hud"><div><div id="pName" class="hudName"></div><div class="health"><div id="pHp" class="hp"></div></div></div><div id="timer" class="timer">60</div><div class="enemyHud"><div id="eName" class="hudName"></div><div class="health"><div id="eHp" class="hp"></div></div></div></div>
 <div id="round" class="round hidden">FIGHT!</div>
 <div class="touch"><div class="pad"><button class="ctrl" data-hold="left">◀</button><button class="ctrl" data-hold="right">▶</button></div><div class="actions"><button class="ctrl punch" data-act="punch">P</button><button class="ctrl kick" data-act="kick">K</button><button class="ctrl block" data-hold="block">BLOCK</button><button class="ctrl special" data-act="special">★</button></div></div>
 <div class="help">Teclado: ← → · A puñetazo · S patada · D especial · Shift bloquear</div>
 <div id="result" class="result hidden"><h2 id="resultTitle">K.O.</h2><p id="resultText"></p><button id="again">NUEVO COMBATE</button></div>
</section>
<script>
const fighters=[
{id:'hanna',name:'Hanna Fatima',icon:'🧕🏻',age:70,power:100,speed:.82,body:'elder',clothes:'#f5f3e9',accent:'#ffffff',skin:'#b98261',special:'CHANCLA FINAL',damage:[11,17,37],style:'chancla'},
{id:'abdel',name:'Abdelkader El Idrissi',icon:'👨🏼‍🦲',age:60,power:91,speed:.86,body:'heavy',clothes:'#26334a',accent:'#b89863',skin:'#b47c5b',special:'EMBESTIDA DEL PATRIARCA',damage:[10,16,30],style:'power'},
{id:'miloud',name:'Miloud El Idrissi',icon:'🧔🏻',age:42,power:86,speed:.91,body:'heavy',clothes:'#5b2830',accent:'#1c1b1a',skin:'#ad7454',special:'PLACAJE IMPARABLE',damage:[9,16,29],style:'tackle'},
{id:'hada',name:'Hada El Idrissi',icon:'💃🏻',age:24,power:72,speed:1.15,body:'slim',clothes:'#7a294d',accent:'#e4b6c9',skin:'#b77b5e',special:'RISA DEVASTADORA',damage:[8,14,26],style:'laugh'},
{id:'mohamed',name:'Mohamed El Idrissi',icon:'🧙🏻‍♂️',age:35,power:87,speed:1.03,body:'tall',clothes:'#202733',accent:'#d6aa4e',skin:'#b77b58',special:'ARCANO DE HIERRO',damage:[9,16,31],style:'arcane'},
{id:'zoher',name:'Zoher El Idrissi',icon:'🛴',age:20,power:75,speed:1.20,body:'slim',clothes:'#1b1e23',accent:'#dedede',skin:'#ad7657',special:'RUEDA CALLEJERA',damage:[8,14,27],style:'street'},
{id:'suliman',name:'Suliman El Idrissi',icon:'🤵🏻',age:35,power:85,speed:.98,body:'tall',clothes:'#27303c',accent:'#d7d8dc',skin:'#b77d5b',special:'CABEZAZO EJECUTIVO',damage:[9,16,30],style:'headbutt'},
{id:'tamimount',name:'Tamimount El Idrissi',icon:'👩🏻‍🍼',age:40,power:82,speed:.93,body:'normal',clothes:'#5e495e',accent:'#d5b9ce',skin:'#b47859',special:'MIRADA FINAL',damage:[9,15,29],style:'stare'},
{id:'jamila',name:'Jamila Monhou',icon:'🧕🏽',age:45,power:84,speed:.90,body:'normal',clothes:'#3f5140',accent:'#d1c4a1',skin:'#a96f50',special:'ESCOBA SUPREMA',damage:[9,16,30],style:'broom'},
{id:'nabila',name:'Nabila Belhaj',icon:'🥋',age:25,power:83,speed:1.18,body:'slim',clothes:'#f2eee2',accent:'#202020',skin:'#b97e60',special:'PATADA BELHAJ',damage:[8,16,30],style:'karate'}];
let selected=null,enemy=null,engine=null,scene=null,P=null,E=null,pHP=100,eHP=100,ended=false,started=false,timeLeft=60,lastTick=0,aiAt=0,keys={left:false,right:false,block:false};
const $=x=>document.getElementById(x);const grid=$('grid');
fighters.forEach(f=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<div class="avatar"><span class="sil">${f.icon}</span><span class="power">POWER ${f.power}</span></div><div class="cardName">${f.name}</div><div class="move">${f.special}</div>`;b.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=f;$('choose').disabled=false;$('choose').textContent='COMBATIR CON '+f.name};grid.appendChild(b)});
$('choose').onclick=()=>{if(!selected)return;const rivals=fighters.filter(f=>f.id!==selected.id);enemy=rivals[Math.floor(Math.random()*rivals.length)];$('vsP').innerHTML=`<span class="vsMini">${selected.icon}</span>${selected.name}`;$('vsE').innerHTML=`<span class="vsMini">${enemy.icon}</span>${enemy.name}`;$('select').classList.add('hidden');$('versus').classList.remove('hidden');setTimeout(()=>{$('versus').classList.add('hidden');$('game').classList.remove('hidden');bootFight()},1250)};
function mat(scene,name,color,metal=.05,rough=.75){let m=new BABYLON.PBRMaterial(name,scene);m.albedoColor=BABYLON.Color3.FromHexString(color);m.metallic=metal;m.roughness=rough;return m}
function part(name,type,scene,opts,material,parent,pos){let m=type==='sphere'?BABYLON.MeshBuilder.CreateSphere(name,opts,scene):type==='cyl'?BABYLON.MeshBuilder.CreateCylinder(name,opts,scene):BABYLON.MeshBuilder.CreateBox(name,opts,scene);m.material=material;m.parent=parent;m.position=new BABYLON.Vector3(...pos);return m}
function makeFighter(f,x,flip){const root=new BABYLON.TransformNode(f.id,scene);root.position.x=x;root.rotation.y=flip?Math.PI:0;const skin=mat(scene,f.id+'skin',f.skin,0,.88),cloth=mat(scene,f.id+'cloth',f.clothes,.03,.78),accent=mat(scene,f.id+'acc',f.accent,.08,.55),dark=mat(scene,f.id+'dark','#17191c',.05,.85);let scale=f.body==='heavy'?1.14:f.body==='tall'?1.08:f.body==='slim'?.94:1;root.scaling=new BABYLON.Vector3(scale,f.body==='tall'?1.09:1,scale);const torso=part('torso','cyl',scene,{height:1.35,diameterTop:.72,diameterBottom:.88,tessellation:16},cloth,root,[0,1.85,0]);const head=part('head','sphere',scene,{diameter:.72,segments:16},skin,root,[0,2.88,0]);const neck=part('neck','cyl',scene,{height:.26,diameter:.28,tessellation:12},skin,root,[0,2.48,0]);const armL=new BABYLON.TransformNode('armL',scene),armR=new BABYLON.TransformNode('armR',scene);armL.parent=root;armR.parent=root;armL.position=new BABYLON.Vector3(-.48,2.25,0);armR.position=new BABYLON.Vector3(.48,2.25,0);part('uaL','cyl',scene,{height:.9,diameter:.26,tessellation:12},cloth,armL,[0,-.35,0]);part('handL','sphere',scene,{diameter:.3},skin,armL,[0,-.85,0]);part('uaR','cyl',scene,{height:.9,diameter:.26,tessellation:12},cloth,armR,[0,-.35,0]);part('handR','sphere',scene,{diameter:.3},skin,armR,[0,-.85,0]);const legL=new BABYLON.TransformNode('legL',scene),legR=new BABYLON.TransformNode('legR',scene);legL.parent=root;legR.parent=root;legL.position=new BABYLON.Vector3(-.24,1.18,0);legR.position=new BABYLON.Vector3(.24,1.18,0);part('legLmesh','cyl',scene,{height:1.45,diameter:.31,tessellation:12},dark,legL,[0,-.62,0]);part('legRmesh','cyl',scene,{height:1.45,diameter:.31,tessellation:12},dark,legR,[0,-.62,0]);part('shoeL','box',scene,{width:.34,height:.18,depth:.62},dark,legL,[0,-1.34,.14]);part('shoeR','box',scene,{width:.34,height:.18,depth:.62},dark,legR,[0,-1.34,.14]);
 if(['hanna','jamila','tamimount'].includes(f.id)){let scarf=part('hijab','sphere',scene,{diameter:.88,segments:16},cloth,root,[0,2.88,.02]);scarf.scaling.y=1.15;head.scaling=.82}
 if(f.id==='hanna'){const robe=part('robe','cyl',scene,{height:1.65,diameterTop:.82,diameterBottom:1.15,tessellation:18},cloth,root,[0,1.55,0]);torso.isVisible=false}
 if(f.id==='mohamed'){let g1=BABYLON.MeshBuilder.CreateTorus('g1',{diameter:.32,thickness:.035,tessellation:24},scene),g2=g1.clone('g2');g1.material=g2.material=dark;g1.parent=g2.parent=root;g1.position=new BABYLON.Vector3(-.18,2.91,-.34);g2.position=new BABYLON.Vector3(.18,2.91,-.34)}
 if(f.id==='abdel'){let hair=part('sidehair','cyl',scene,{height:.22,diameter:.75,tessellation:16},dark,root,[0,3.08,0]);hair.scaling.y=.45}
 if(['miloud','zoher','suliman','mohamed'].includes(f.id)){let hair=part('hair','sphere',scene,{diameter:.68},dark,root,[0,3.12,0]);hair.scaling.y=.35}
 if(f.id==='jamila'){let stick=part('broom','cyl',scene,{height:1.8,diameter:.08},accent,armR,[0,-1.25,0]);stick.rotation.z=.15}
 if(f.id==='hanna'){let chancla=part('chancla','box',scene,{width:.22,height:.07,depth:.58},accent,armR,[0,-1.0,.15]);chancla.rotation.x=.15}
 root.metadata={f,armL,armR,legL,legR,baseY:0,busy:false,block:false};return root}
function bootFight(){pHP=eHP=100;ended=false;started=false;timeLeft=60;lastTick=performance.now();$('pHp').style.width=$('eHp').style.width='100%';$('timer').textContent='60';$('pName').textContent=selected.name;$('eName').textContent=enemy.name;$('result').classList.add('hidden');const canvas=$('renderCanvas');if(engine)engine.dispose();engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.04,.055,.08,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.018;scene.fogColor=new BABYLON.Color3(.06,.08,.1);const camera=new BABYLON.FreeCamera('cam',new BABYLON.Vector3(0,3.2,-11),scene);camera.setTarget(new BABYLON.Vector3(0,1.55,0));camera.fov=.65;const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.9;const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.4,-1,.55),scene);key.position=new BABYLON.Vector3(3,8,-5);key.intensity=1.5;const shadow=new BABYLON.ShadowGenerator(1024,key);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=22;const floor=BABYLON.MeshBuilder.CreateGround('floor',{width:24,height:9},scene);floor.material=mat(scene,'floorM','#504537',0,.92);floor.receiveShadows=true;for(let i=-6;i<=6;i++){let post=part('post'+i,'box',scene,{width:.12,height:3.2,depth:.12},mat(scene,'pm'+i,i%2?'#8e1e2d':'#b58944',.2,.6),null,[i*1.7,1.6,2.8]);shadow.addShadowCaster(post)}const back=part('back','box',scene,{width:23,height:4,depth:.3},mat(scene,'backm','#202a36',.05,.85),null,[0,2.0,3.4]);const sign=part('sign','box',scene,{width:7,height:.9,depth:.15},mat(scene,'signm','#b78a2f',.18,.4),null,[0,3.35,3.15]);P=makeFighter(selected,-2.7,false);E=makeFighter(enemy,2.7,true);P.getChildMeshes().forEach(m=>shadow.addShadowCaster(m));E.getChildMeshes().forEach(m=>shadow.addShadowCaster(m));$('round').classList.remove('hidden');setTimeout(()=>{$('round').classList.add('hidden');started=true},800);engine.runRenderLoop(loop);window.onresize=()=>engine.resize()}
function dist(){return Math.abs(E.position.x-P.position.x)}function updateHUD(){$('pHp').style.width=Math.max(0,pHP)+'%';$('eHp').style.width=Math.max(0,eHP)+'%'}
function animateStrike(actor,type){if(actor.metadata.busy)return;actor.metadata.busy=true;const m=actor.metadata;const limb=type==='kick'?m.legR:m.armR;const from=limb.rotation.x;let a=new BABYLON.Animation('atk','rotation.x',60,BABYLON.Animation.ANIMATIONTYPE_FLOAT,BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);a.setKeys([{frame:0,value:from},{frame:5,value:-1.45},{frame:10,value:.25},{frame:15,value:from}]);limb.animations=[a];scene.beginAnimation(limb,0,15,false,1.7,()=>{m.busy=false});if(type==='special'){let glow=new BABYLON.PointLight('flash',actor.position.add(new BABYLON.Vector3(0,2,-.5)),scene);glow.diffuse=new BABYLON.Color3(1,.68,.15);glow.intensity=7;setTimeout(()=>glow.dispose(),150)}}
function playerAttack(type){if(!started||ended||P.metadata.busy)return;animateStrike(P,type);const idx=type==='punch'?0:type==='kick'?1:2;const reach=type==='special'?2.65:2.05;if(dist()<=reach){let dmg=selected.damage[idx]*(E.metadata.block?.32:1);eHP-=dmg;impact(E,type,dmg);updateHUD();if(eHP<=0)finish(true)}}
function impact(target,type,dmg){target.position.x+=target===E?.22:-.22;const s=BABYLON.MeshBuilder.CreateSphere('impact',{diameter:type==='special'?.52:.3,segments:8},scene);s.position=target.position.add(new BABYLON.Vector3(0,1.9,-.35));s.material=mat(scene,'im'+Math.random(),type==='special'?'#ffd264':'#ffffff',.1,.25);setTimeout(()=>s.dispose(),100)}
function cpu(now){if(!started||ended||E.metadata.busy)return;if(now<aiAt)return;aiAt=now+330+Math.random()*420;let d=dist();if(d>2.1){E.position.x-=Math.min(.42*enemy.speed,d-1.9);return}if(Math.random()<.19){E.metadata.block=true;setTimeout(()=>E.metadata.block=false,400);return}let r=Math.random(),type=r<.5?'punch':r<.86?'kick':'special',idx=type==='punch'?0:type==='kick'?1:2;animateStrike(E,type);setTimeout(()=>{if(ended||dist()>2.6)return;let dmg=enemy.damage[idx]*(keys.block?.30:1);pHP-=dmg;impact(P,type,dmg);updateHUD();if(pHP<=0)finish(false)},120)}
function loop(){if(!scene)return;let now=performance.now(),dt=Math.min(.035,(now-lastTick)/1000);lastTick=now;if(started&&!ended){let sp=3.0*selected.speed*dt;if(keys.left)P.position.x=Math.max(-4.8,P.position.x-sp);if(keys.right)P.position.x=Math.min(E.position.x-1.35,P.position.x+sp);P.metadata.block=keys.block;if(now-(window._sec||now)>=1000){window._sec=now;timeLeft--;if(timeLeft<0)timeLeft=0;$('timer').textContent=timeLeft;if(timeLeft<=0)finish(pHP>=eHP)}cpu(now);let mid=(P.position.x+E.position.x)/2;scene.activeCamera.position.x+=(mid-scene.activeCamera.position.x)*.04;scene.activeCamera.setTarget(new BABYLON.Vector3(mid,1.55,0))}scene.render()}
function finish(win){if(ended)return;ended=true;started=false;$('resultTitle').textContent=win?'K.O.':'DEFEAT';$('resultText').textContent=win?`${selected.name} derrota a ${enemy.name}`:`${enemy.name} derrota a ${selected.name}`;$('result').classList.remove('hidden')}
$('again').onclick=()=>{if(engine){engine.stopRenderLoop();engine.dispose();engine=null}$('game').classList.add('hidden');$('select').classList.remove('hidden');selected=null;document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));$('choose').disabled=true;$('choose').textContent='Elige luchador'};
addEventListener('keydown',e=>{if(e.repeat&&['a','s','d'].includes(e.key.toLowerCase()))return;if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='Shift')keys.block=true;if(e.key.toLowerCase()==='a')playerAttack('punch');if(e.key.toLowerCase()==='s')playerAttack('kick');if(e.key.toLowerCase()==='d')playerAttack('special')});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key==='Shift')keys.block=false});
document.querySelectorAll('[data-hold]').forEach(b=>{let k=b.dataset.hold;const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();playerAttack(b.dataset.act)}));
</script>
</body></html>
