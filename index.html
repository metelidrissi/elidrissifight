const $=x=>document.getElementById(x);let sel=null,foe=null,engine,scene,P,E,pHP=100,eHP=100,ended=false,ready=false,last=0,ai=0,time=60,tick=0,hold={left:false,right:false,block:false};
function portrait(f){let cls='portrait '+(f.portrait||'');return `<div class="${cls}" style="--cloth:${f.cloth};--hijab:${f.hijab||f.hair}"><div class="hair"></div><div class="head"></div><div class="glasses"></div><div class="mustache"></div><div class="body"></div></div>`}
F.forEach(f=>{let b=document.createElement('button');b.className='card';b.innerHTML=portrait(f)+`<span class="pow">${f.power}</span><div class="nm">${f.name}</div><div class="sp">${f.special}</div>`;b.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=f;$('go').disabled=false;$('go').textContent='LUCHAR CON '+f.name.toUpperCase()};$('roster').appendChild(b)});
$('go').onclick=()=>{if(!sel)return;let list=F.filter(x=>x.id!==sel.id);foe=list[Math.floor(Math.random()*list.length)];$('v1').innerHTML=`<div class="big">${sel.name}</div><div class="move">${sel.special}</div>`;$('v2').innerHTML=`<div class="big">${foe.name}</div><div class="move">${foe.special}</div>`;$('select').classList.add('hide');$('versus').classList.remove('hide');setTimeout(()=>{$('versus').classList.add('hide');$('game').classList.remove('hide');boot()},1450)};
function m(name,color,metal=.02,rough=.72){let z=new BABYLON.PBRMaterial(name,scene);z.albedoColor=BABYLON.Color3.FromHexString(color);z.metallic=metal;z.roughness=rough;return z}
function box(n,w,h,d,mat,parent,x,y,z){let q=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);q.material=mat;q.parent=parent;q.position.set(x,y,z);return q}
function sphere(n,diam,mat,parent,x,y,z){let q=BABYLON.MeshBuilder.CreateSphere(n,{diameter:diam,segments:18},scene);q.material=mat;q.parent=parent;q.position.set(x,y,z);return q}
function cyl(n,h,dt,db,mat,parent,x,y,z){let q=BABYLON.MeshBuilder.CreateCylinder(n,{height:h,diameterTop:dt,diameterBottom:db,tessellation:18},scene);q.material=mat;q.parent=parent;q.position.set(x,y,z);return q}
function limb(n,len,th,mat,parent,x,y,z){let q=cyl(n,len,th,th*.9,mat,parent,x,y,z);q.rotation.z=Math.PI/2;return q}
function fighter(f,x,faceRight){let root=new BABYLON.TransformNode(f.id,scene);root.position.x=x;root.rotation.y=faceRight?0:Math.PI;let skin=m(f.id+'skin',f.skin),cloth=m(f.id+'cloth',f.cloth,.04,.62),acc=m(f.id+'acc',f.accent,.12,.48),hair=m(f.id+'hair',f.hair,0,.88),black=m(f.id+'black','#111214',.12,.5);let wide=f.body==='heavy'?1.22:f.body==='slim'?.88:1, tall=f.body==='tall'?1.10:1;root.scaling.set(wide,tall,wide);let pelvis=box('pelvis',.63,.34,.38,cloth,root,0,1.18,0),torso=cyl('torso',1.25,.72,.92,cloth,root,0,1.95,0);if(f.body==='heavy'){let belly=sphere('belly',1.04,cloth,root,0,1.72,.16);belly.scaling.y=.88}let neck=cyl('neck',.22,.27,.29,skin,root,0,2.67,0),head=sphere('head',.67,skin,root,0,3.06,0);head.scaling.y=1.09;let nose=box('nose',.12,.13,.16,skin,head,0,-.02,-.33);let brow1=box('b1',.18,.035,.025,hair,head,-.15,.12,-.31),brow2=box('b2',.18,.035,.025,hair,head,.15,.12,-.31);if(f.portrait.includes('glasses')){let frame1=BABYLON.MeshBuilder.CreateTorus('g1',{diameter:.24,thickness:.025,tessellation:20},scene);frame1.material=black;frame1.parent=head;frame1.position.set(-.15,.04,-.33);frame1.rotation.x=Math.PI/2;let frame2=frame1.clone('g2');frame2.parent=head;frame2.position.x=.15;box('bridge',.11,.025,.025,black,head,0,.04,-.34)}if(f.id==='abdel'){let stache=box('stache',.34,.07,.055,hair,head,0,-.13,-.33);stache.scaling.x=1.15}if(f.hijab){let hood=sphere('hood',.86,m(f.id+'hood',f.hijab,.02,.78),root,0,3.06,.06);hood.scaling.set(1,1.18,.72);head.position.z=-.12} else {let cap=sphere('haircap',.7,hair,root,0,3.22,.05);cap.scaling.set(1,.45,.85)}let shoulderL=sphere('sl',.34,cloth,root,-.50,2.35,0),shoulderR=sphere('sr',.34,cloth,root,.50,2.35,0);let armL=limb('al',.68,.22,cloth,root,-.72,2.13,0),armR=limb('ar',.68,.22,cloth,root,.72,2.13,0);let foreL=limb('fl',.62,.19,skin,root,-1.12,2.05,0),foreR=limb('fr',.62,.19,skin,root,1.12,2.05,0);let handL=sphere('hl',.23,skin,root,-1.48,2.05,0),handR=sphere('hr',.23,skin,root,1.48,2.05,0);let legL=cyl('ll',1.12,.30,.24,cloth,root,-.25,.53,0),legR=cyl('lr',1.12,.30,.24,cloth,root,.25,.53,0),shoeL=box('shl',.34,.18,.61,black,root,-.25,-.08,-.11),shoeR=box('shr',.34,.18,.61,black,root,.25,-.08,-.11);if(f.id==='hanna'){let robe=cyl('robe',1.55,1.02,.62,cloth,root,0,.85,0);robe.scaling.x=1.12;let sandal=box('chancla',.16,.06,.62,black,handR,.18,0,-.25);sandal.rotation.z=.35}if(f.id==='jamila'){let broom=cyl('broom',2.5,.055,.055,m('wood'+f.id,'#8d6338'),handR,.25,.0,0);broom.rotation.z=.28;let br=cyl('brush',.42,.28,.10,m('brush','#c09a55'),broom,0,1.35,0)}if(f.id==='mohamed'){let chest=box('reactor',.18,.18,.04,acc,torso,0,.16,-.39);chest.material.emissiveColor=BABYLON.Color3.FromHexString('#d7aa49')}if(f.id==='zoher'){let cap=box('cap',.52,.12,.55,acc,root,0,3.38,-.06);cap.rotation.x=.1}if(f.id==='suliman'){let lapel1=box('lapel1',.12,.6,.035,acc,torso,-.14,.12,-.39);lapel1.rotation.z=-.2;let lapel2=lapel1.clone('lapel2');lapel2.parent=torso;lapel2.position.x=.14;lapel2.rotation.z=.2}if(f.id==='nabila'){let belt=box('belt',.74,.10,.42,black,root,0,1.28,0)}root.metadata={f,parts:{torso,head,armL,armR,foreL,foreR,handL,handR,legL,legR},busy:0,blocking:false,baseY:0};return root}
function arena(){scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.025,.018,.015,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.018;scene.fogColor=new BABYLON.Color3(.18,.11,.07);let cam=new BABYLON.FreeCamera('cam',new BABYLON.Vector3(0,4.1,-11.8),scene);cam.setTarget(new BABYLON.Vector3(0,1.55,0));cam.fov=.68;let hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.95;hemi.diffuse=new BABYLON.Color3(.95,.72,.52);let sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.4,-1,.7),scene);sun.position=new BABYLON.Vector3(5,9,-8);sun.intensity=2.2;let ground=BABYLON.MeshBuilder.CreateGround('ground',{width:24,height:8,subdivisions:2},scene);let gm=m('ground','#65462d',.05,.42);ground.material=gm;ground.receiveShadows=true;for(let i=-6;i<=6;i++){let tile=box('tile'+i,1.7,.035,6,m('t'+i,i%2?'#6b4b30':'#755335',.06,.36),null,i*1.7,-.02,0);tile.receiveShadows=true}for(let side of[-1,1])for(let i=0;i<4;i++){let x=side*(6.8+i*.45),col=cyl('col',4.8,.50,.56,m('stone'+side+i,'#a77a4c',.03,.68),null,x,2.35,1.55+i*.28);let top=box('top',.82,.25,.82,m('cap'+i,'#c09562'),null,x,4.66,1.55+i*.28);let lamp=sphere('lamp',.18,m('lampm','#ffb13b',.05,.3),null,x,2.9,-.1);lamp.material.emissiveColor=new BABYLON.Color3(1,.36,.05)}for(let i=-3;i<=3;i++){let palm=cyl('palm',4,.20,.30,m('palm','#6e492d'),null,i*2.8,2.0,4.0);palm.rotation.z=(i%2?.04:-.04)}let archMat=m('arch','#8d603d',.03,.7);box('back',17,4.2,.35,archMat,null,0,2.1,4.9);for(let i=-3;i<=3;i++){let dark=m('door'+i,'#191311',0,.9);let door=box('door',1.35,2.4,.1,dark,null,i*2.3,1.15,4.68);door.position.z=4.68}let sky=BABYLON.MeshBuilder.CreatePlane('sky',{width:25,height:12},scene);sky.position.set(0,5.3,5.2);sky.rotation.y=Math.PI;let sm=new BABYLON.StandardMaterial('skyM',scene);sm.diffuseColor=new BABYLON.Color3(.55,.18,.08);sm.emissiveColor=new BABYLON.Color3(.35,.08,.03);sky.material=sm;return scene}
function shadowFor(...meshes){let light=scene.lights.find(x=>x.name==='sun');let sg=new BABYLON.ShadowGenerator(1024,light);sg.useBlurExponentialShadowMap=true;sg.blurKernel=20;meshes.forEach(r=>r.getChildMeshes().forEach(x=>sg.addShadowCaster(x)));return sg}
function boot(){engine=new BABYLON.Engine($('c'),true,{preserveDrawingBuffer:true,stencil:true,antialias:true});arena();P=fighter(sel,-2.6,true);E=fighter(foe,2.6,false);shadowFor(P,E);$('pn').textContent=sel.name;$('en').textContent=foe.name;pHP=eHP=100;ended=false;ready=false;time=60;$('ph').style.width='100%';$('eh').style.width='100%';setTimeout(()=>{ready=true;$('ann').classList.remove('hide');setTimeout(()=>$('ann').classList.add('hide'),800)},650);engine.runRenderLoop(loop);addEventListener('resize',()=>engine.resize())}
function face(){let mid=(P.position.x+E.position.x)/2;let dist=Math.max(5.4,Math.abs(E.position.x-P.position.x)+4.8);let cam=scene.activeCamera;cam.position.x+=(mid-cam.position.x)*.06;cam.position.z+=(-dist*1.75-cam.position.z)*.05;cam.setTarget(new BABYLON.Vector3(mid,1.55,0))}
function flash(target,color='#ffb229'){let ps=new BABYLON.ParticleSystem('hit',60,scene);ps.particleTexture=new BABYLON.Texture('https://assets.babylonjs.com/textures/flare.png',scene);ps.emitter=new BABYLON.Vector3(target.position.x,2.0,0);ps.minEmitBox=new BABYLON.Vector3(-.15,-.1,-.1);ps.maxEmitBox=new BABYLON.Vector3(.15,.2,.1);ps.color1=BABYLON.Color4.FromHexString(color+'ff');ps.color2=new BABYLON.Color4(1,.2,.05,1);ps.minSize=.08;ps.maxSize=.22;ps.minLifeTime=.15;ps.maxLifeTime=.35;ps.emitRate=200;ps.gravity=new BABYLON.Vector3(0,-4,0);ps.direction1=new BABYLON.Vector3(-3,1,-1);ps.direction2=new BABYLON.Vector3(3,4,1);ps.start();setTimeout(()=>{ps.stop();setTimeout(()=>ps.dispose(),400)},80)}
function anim(root,type,hit){if(!ready||ended||root.metadata.busy>performance.now())return;let p=root.metadata.parts,now=performance.now(),dur=type==='special'?650:type==='kick'?430:310;root.metadata.busy=now+dur;let dir=root===P?1:-1;let originalX=root.position.x;function tween(t){let q=Math.min(1,(performance.now()-now)/dur),wave=Math.sin(q*Math.PI);if(type==='punch'){p.armR.rotation.z=-dir*wave*1.25;p.foreR.rotation.z=-dir*wave*.45;root.position.x=originalX+dir*wave*.28}if(type==='kick'){p.legR.rotation.z=-dir*wave*1.05;root.position.x=originalX+dir*wave*.18}if(type==='special'){root.position.x=originalX+dir*wave*.65;p.armR.rotation.z=-dir*wave*1.55;p.armL.rotation.z=dir*wave*.65;p.head.rotation.y=wave*.22*dir}if(q<1)requestAnimationFrame(tween);else{root.position.x=originalX;p.armR.rotation.z=p.armL.rotation.z=p.foreR.rotation.z=p.legR.rotation.z=p.head.rotation.y=0}}requestAnimationFrame(tween);setTimeout(hit,dur*.42)}
function damage(att,def,type,isPlayer){let af=att.metadata.f,dist=Math.abs(att.position.x-def.position.x),reach=type==='special'?2.8:2.15;if(dist>reach)return;let idx=type==='punch'?0:type==='kick'?1:2,d=af.d[idx];if(def.metadata.blocking)d*=.28;if(isPlayer)eHP=Math.max(0,eHP-d);else pHP=Math.max(0,pHP-d);def.position.x+=isPlayer?.34:-.34;flash(def,type==='special'?'#ffd34d':'#ff6b27');$('ph').style.width=pHP+'%';$('eh').style.width=eHP+'%';if(pHP<=0||eHP<=0)finish(eHP<=0)}
function attack(type){anim(P,type,()=>damage(P,E,type,true))}
function cpu(now){if(now<ai||ended||!ready)return;let dist=E.position.x-P.position.x;if(dist>2.15){E.position.x-=Math.min(.11*foe.speed,dist-1.9);ai=now+70;return}let r=Math.random();if(r<.18){E.metadata.blocking=true;setTimeout(()=>E.metadata.blocking=false,480);ai=now+650}else{let type=r<.58?'punch':r<.84?'kick':'special';anim(E,type,()=>damage(E,P,type,false));ai=now+(type==='special'?900:560)}}
function finish(win){ended=true;ready=false;$('rtitle').textContent=win?'K.O. ¡VICTORIA!':'K.O. DERROTA';$('rtext').textContent=win?sel.name+' derrota a '+foe.name:foe.name+' derrota a '+sel.name;$('res').classList.remove('hide')}
function loop(){let now=performance.now(),dt=Math.min(.035,(now-last||16)/1000);last=now;if(ready&&!ended){let dir=(hold.right?1:0)-(hold.left?1:0);if(dir){let nx=P.position.x+dir*dt*3.1*sel.speed;P.position.x=Math.max(-5.2,Math.min(E.position.x-1.15,nx))}P.metadata.blocking=hold.block;cpu(now);if(now-tick>1000){tick=now;time--; $('tm').textContent=time;if(time<=0)finish(pHP>=eHP)}}face();scene.render()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')hold.left=true;if(e.key==='ArrowRight')hold.right=true;if(e.key==='Shift')hold.block=true;if(e.key.toLowerCase()==='a')attack('punch');if(e.key.toLowerCase()==='s')attack('kick');if(e.key.toLowerCase()==='d')attack('special')});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')hold.left=false;if(e.key==='ArrowRight')hold.right=false;if(e.key==='Shift')hold.block=false});document.querySelectorAll('[data-hold]').forEach(b=>{let k=b.dataset.hold;['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();hold[k]=true},{passive:false}));['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();hold[k]=false},{passive:false}))});document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();attack(b.dataset.act)}));
</script></body></html>
